name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run Backend Tests
        run: |
          PYTHONPATH=apps/backend python apps/backend/tests/verify_flow.py
          PYTHONPATH=apps/backend python apps/backend/tests/rag/test_rag_quality.py
          PYTHONPATH=apps/backend python apps/backend/tests/smoke/test_smoke.py

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd apps/frontend
          npm ci

      - name: Run Linter
        run: |
          cd apps/frontend
          npm run lint

      - name: Build Frontend
        run: |
          cd apps/frontend
          npm run build
